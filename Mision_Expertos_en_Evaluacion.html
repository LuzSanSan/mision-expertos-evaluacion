const escapeRooms = [
 {title:"Sala 1 · El archivo de las columnas", intro:"La puerta del archivo se abrirá si identificas las reglas para construir una prueba de pareamiento.", code:"COLUMNA", tasks:[
  {q:"¿Qué característica deben compartir los elementos de las dos columnas?", options:["Deben ser consistentes y relacionarse por un criterio claro y de la misma naturaleza.","Deben combinar temas variados para que la relación sea difícil de anticipar.","Deben tener exactamente la misma redacción y el mismo orden en ambas columnas."], correct:0, digit:"4", why:"Las columnas deben contener elementos consistentes y la consigna debe explicar claramente la relación."},
  {q:"¿Qué recurso puede reducir las asociaciones por simple descarte?", options:["Incluir más respuestas que premisas mediante distractores adecuados.","Utilizar exactamente una respuesta por cada premisa y evitar cualquier distractor.","Repetir todas las premisas en la columna de respuestas para facilitar la lectura."], correct:0, digit:"8", why:"El material sugiere incluir distractores adicionales en la columna de respuestas."},
  {q:"¿Cómo conviene distribuir el ejercicio para evitar pistas y facilitar su lectura?", options:["Ordenar una columna con criterio lógico, evitar pistas y mantener el ítem en una página.","Ordenar ambas columnas como parejas directas y separar las respuestas en otra página.","Destacar con negrita las respuestas correctas y explicar el criterio al terminar."], correct:0, digit:"2", why:"Se recomienda ordenar una columna con un criterio, evitar pistas y mantener el ítem completo en una misma página."}
 ]},
 {title:"Sala 2 · El laboratorio de afirmaciones", intro:"Ahora debes desactivar las trampas de redacción en una prueba de alternativa constante.", code:"VERDAD", tasks:[
  {q:"¿Qué tipo de redacción conviene priorizar?", options:["Afirmaciones precisas, claras y de extensión aproximadamente semejante.","Afirmaciones ambiguas, largas y con varias ideas que puedan interpretarse de distintas formas.","Afirmaciones copiadas literalmente y con diferencias marcadas de extensión entre verdaderas y falsas."], correct:0, digit:"6", why:"El material recomienda palabras precisas, situaciones nuevas y enunciados de extensión aproximadamente igual."},
  {q:"¿Qué palabras pueden dar pistas involuntarias?", options:["Términos absolutos como «siempre», «nunca», «todo» o «ningún».","Términos específicos del contenido que se evalúa y expresiones claramente definidas.","Conectores que organizan una frase breve y ayudan a comprender la relación entre sus partes."], correct:0, digit:"1", why:"Los términos absolutos pueden revelar la falsedad de una afirmación y deben evitarse cuando funcionen como pistas."},
  {q:"¿Qué puede ayudar a reducir el efecto de la adivinación?", options:["Pedir una fundamentación o que se identifique y corrija la parte que vuelve falso el enunciado.","Usar solo afirmaciones verdaderas y no explicar las reglas de puntuación antes de responder.","Hacer que las afirmaciones falsas sean más largas y repetir un patrón fijo en las respuestas."], correct:0, digit:"9", why:"El material describe variantes que solicitan fundamentar la decisión o identificar y corregir la palabra o frase que vuelve falso el enunciado."}
 ]}
];
let index = 0, score = 0, answered = false, picks = [], activeMode = "quiz", shuffledQuestions = [], caseIndex = 0, caseScore = 0, casePicks = [], roomIndex = 0, taskIndex = 0, roomDigits = [], roomScore = 0, roomAnswered = false, studentInfo = { name: "", surname: "", section: "" };
const main = document.getElementById('main');
function shuffleOptions(q) { const arr=q.options.map((text,oldIndex)=>({text,oldIndex})); for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];} return {...q,displayOptions:arr,displayCorrect:arr.findIndex(x=>x.oldIndex===q.correct)}; }
function start() {
 activeMode="quiz"; index = 0; score = 0; answered = false; picks = []; shuffledQuestions=questions.map(shuffleOptions);
 renderQuestion();
}
function renderHome() {
 activeMode="home";
 main.innerHTML = `<section class="card"><span class="stage-label">🔐 Escape room educativo</span><h2>🧭 Misión: Expertos en Evaluación</h2><p class="small">Antes de comenzar, registra tus datos. Luego deberás superar dos salas con desafíos sobre la prueba de pareamiento y la prueba de alternativa constante (Verdadero/Falso).</p><form id="studentForm" onsubmit="registerAndStart(event)"><div class="registration-grid"><label class="field" for="studentName">Nombre<input id="studentName" name="studentName" autocomplete="given-name" required maxlength="60" placeholder="Escribe tu nombre"></label><label class="field" for="studentSurname">Apellido<input id="studentSurname" name="studentSurname" autocomplete="family-name" required maxlength="60" placeholder="Escribe tu apellido"></label><label class="field" for="studentSection">Sección<select id="studentSection" name="studentSection" required><option value="">Selecciona tu sección</option><option value="A">A</option><option value="B">B</option></select></label></div><div class="result-summary"><strong>📌 Antes de entrar</strong><p class="small">Lee cada desafío con atención. Si te equivocas, recibirás una pista y podrás intentarlo nuevamente. Al finalizar verás tu puntuación junto con los datos que registraste.</p></div><button class="btn primary" type="submit">Registrar datos y comenzar →</button></form></section><footer>Actividad de práctica educativa. Los datos y resultados se muestran en esta sesión; no se envían automáticamente a una base de datos ni a Classroom.</footer>`;
}
function registerAndStart(event) {
 event.preventDefault();
 const form = document.getElementById('studentForm');
 if (!form.reportValidity()) return;
 studentInfo = { name: form.studentName.value.trim(), surname: form.studentSurname.value.trim(), section: form.studentSection.value };
 if (!studentInfo.name || !studentInfo.surname || !studentInfo.section) return;
 startEscape();
}
function renderQuestion() {
 answered = false;
 const q = shuffledQuestions[index];
 const pct = (index/questions.length)*100;
 main.innerHTML = `<div class="topline"><span class="pill">Pregunta ${index+1} de ${questions.length}</span><span class="pill">⭐ Puntuación: ${score}</span></div><div class="progress" aria-label="Progreso"><div style="width:${pct}%"></div></div><section class="card"><span class="stage-label">${q.stage} · ${q.topic}</span><h2 class="question">${q.q}</h2><div class="options">${q.displayOptions.map((o,i)=>`<button class="option" data-i="${i}" onclick="choose(${i})"><span class="letter">${String.fromCharCode(65+i)}</span><span>${o.text}</span></button>`).join('')}</div><p class="option-note">Las alternativas cambian de posición en cada intento.</p><div id="feedback" class="feedback" aria-live="polite"></div><div class="actions"><button class="btn secondary" onclick="renderHome()">Salir al inicio</button><button id="next" class="btn primary" onclick="nextQuestion()" disabled>${index===questions.length-1?'Ver resultados':'Siguiente pregunta →'}</button></div></section><footer>Consejo: piensa en la norma o sugerencia que fundamenta tu elección.</footer>`;
}
function choose(i) {
 if(answered) return;
 answered = true;
 const q = shuffledQuestions[index]; const ok = i === q.displayCorrect;
 if(ok) score += 10;
 picks.push({selected:i, correct:q.displayCorrect, ok});
 document.querySelectorAll('.option').forEach((b,j)=>{
   b.disabled = true;
   if(j===q.displayCorrect) b.classList.add('correct');
   else if(j===i) b.classList.add('incorrect');
 });
 const fb = document.getElementById('feedback');
 fb.className = 'feedback show ' + (ok?'good':'bad');
 fb.innerHTML = `<strong>${ok?'¡Correcto! +10 puntos':'Respuesta no correcta'}</strong><br>${q.why}`;
 document.getElementById('next').disabled = false;
 document.querySelector('.topline .pill:last-child').textContent = '⭐ Puntuación: '+score;
}
function nextQuestion() {
 if(!answered) return;
 if(index < questions.length-1) { index++; renderQuestion(); }
 else renderResults();
}
function renderResults() {
 const percent = Math.round(score/(questions.length*10)*100);
 let msg = percent>=90?'¡Excelente! Dominas las recomendaciones principales.':percent>=70?'¡Buen trabajo! Revisa las explicaciones de los ítems que te resultaron difíciles.':'Buen comienzo. Lee las retroalimentaciones y vuelve a intentarlo para afianzar las normas.';
 main.innerHTML = `<section class="card"><span class="stage-label">Misión completada</span><h2>¡Terminaste el recorrido!</h2><div class="result-score">${score}/${questions.length*10}</div><p><strong>${percent}% de respuestas correctas</strong></p><p>${msg}</p><div class="result-summary"><strong>Lo que has practicado</strong><p class="small">Normas para organizar las columnas de pareamiento, distractores y errores frecuentes; aprendizajes que puede evaluar la alternativa constante; redacción de enunciados, palabras que conviene evitar, ventajas, desventajas y variantes para reducir la adivinación.</p></div><h3>Revisión de respuestas</h3><div class="review-list">${questions.map((q,i)=>`<div class="review-item"><strong>${i+1}. ${picks[i]?.ok?'✓ Correcta':'↻ Para repasar'} · ${q.topic}</strong><div class="small">${q.why}</div></div>`).join('')}</div><div class="actions"><button class="btn secondary" onclick="renderHome()">Volver al inicio</button><button class="btn primary" onclick="start()">Repetir misión ↻</button></div></section><footer>Este juego es una actividad de práctica; no guarda nombres ni envía resultados a una base de datos.</footer>`;
}
function startDetectives(){activeMode="detectives";caseIndex=0;caseScore=0;casePicks=[];renderDetective();}
function renderDetective(){answered=false;const c=detectiveCases[caseIndex],sh=shuffleOptions(c);window.currentCase=sh;main.innerHTML=`<div class="topline"><span class="pill">Caso ${caseIndex+1} de ${detectiveCases.length}</span><span class="pill">🕵️ Casos resueltos: ${caseScore}</span></div><div class="progress"><div style="width:${caseIndex/detectiveCases.length*100}%"></div></div><section class="card"><span class="stage-label">Detectives de errores · ${c.kind}</span><h2>${c.title}</h2><div class="clue-box"><strong>📁 Evidencia del caso</strong><p>${c.scene}</p></div><h3 class="question">${c.ask}</h3><div class="options">${sh.displayOptions.map((o,i)=>`<button class="option" onclick="chooseCase(${i})"><span class="letter">${String.fromCharCode(65+i)}</span><span>${o.text}</span></button>`).join('')}</div><p class="option-note">Las opciones cambian de orden en cada caso. Analiza la evidencia antes de decidir.</p><div id="caseFeedback" class="feedback" aria-live="polite"></div><div class="actions"><button class="btn secondary" onclick="renderHome()">Volver al menú</button><button class="btn primary" id="caseNext" onclick="nextCase()" disabled>${caseIndex===detectiveCases.length-1?'Ver informe final':'Siguiente caso →'}</button></div></section>`;}
function chooseCase(i){if(answered)return;answered=true;const c=window.currentCase,ok=i===c.displayCorrect;if(ok)caseScore++;casePicks.push({ok,title:c.title});document.querySelectorAll('.option').forEach((b,j)=>{b.disabled=true;if(j===c.displayCorrect)b.classList.add('correct');else if(j===i)b.classList.add('incorrect');});const f=document.getElementById('caseFeedback');f.className='feedback show '+(ok?'good':'bad');f.innerHTML=`<strong>${ok?'¡Caso resuelto!':'Pista para mejorar'}</strong><br>${c.why}`;document.getElementById('caseNext').disabled=false;document.querySelector('.topline .pill:last-child').textContent='🕵️ Casos resueltos: '+caseScore;}
function nextCase(){if(!answered)return;if(caseIndex<detectiveCases.length-1){caseIndex++;renderDetective();}else renderDetectiveResults();}
function renderDetectiveResults(){main.innerHTML=`<section class="card"><span class="stage-label">Informe de investigación</span><h2>🕵️ Informe final de detectives</h2><div class="result-score">${caseScore}/${detectiveCases.length}</div><p>${caseScore===detectiveCases.length?'¡Excelente trabajo! Identificaste todos los errores.':'Buen trabajo. Revisa las pistas y vuelve a intentarlo para consolidar los criterios de elaboración.'}</p><div class="review-list">${casePicks.map((p,i)=>`<div class="review-item"><strong>${p.ok?'✓':'↻'} ${p.title}</strong><div class="small">${p.ok?'Identificaste la dificultad principal.':'Vuelve a leer la explicación del caso para reconocer la norma relacionada.'}</div></div>`).join('')}</div><div class="actions"><button class="btn secondary" onclick="renderHome()">Menú principal</button><button class="btn primary" onclick="startDetectives()">Repetir investigación ↻</button></div></section>`;}
function startEscape(){activeMode="escape";roomIndex=0;taskIndex=0;roomDigits=[];roomScore=0;roomAnswered=false;renderEscapeIntro();}
function renderEscapeIntro(){main.innerHTML=`<section class="card"><span class="stage-label">Escape room educativo</span><h2>🔐 El archivo de evaluación está bloqueado</h2><p>Para salir, deberás superar dos salas: primero, las reglas de la prueba de pareamiento; después, las recomendaciones para redactar ítems de Verdadero/Falso.</p><div class="room-locks"><div class="lock"><strong>🚪 Sala 1</strong><span>Prueba de pareamiento</span></div><div class="lock"><strong>🚪 Sala 2</strong><span>Alternativa constante</span></div><div class="lock"><strong>🔑 Código</strong><span>6 dígitos por descubrir</span></div></div><div class="result-summary"><strong>Cómo jugar</strong><p class="small">Cada sala contiene tres preguntas. Una respuesta correcta te revela un dígito; si fallas, recibirás una explicación y podrás continuar, pero tendrás que revisar el contenido para completar el código con éxito.</p></div><button class="btn primary" onclick="renderEscapeTask()">Comenzar escape room →</button></section>`;}
function renderEscapeTask(){roomAnswered=false;const room=escapeRooms[roomIndex],t=room.tasks[taskIndex],sh=shuffleOptions(t);window.currentRoomTask=sh;main.innerHTML=`<div class="topline"><span class="pill">Sala ${roomIndex+1} de ${escapeRooms.length} · Reto ${taskIndex+1} de ${room.tasks.length}</span><span class="pill">🔑 Dígitos encontrados: ${roomDigits.length}/6</span></div><div class="progress"><div style="width:${((roomIndex*3+taskIndex)/6)*100}%"></div></div><section class="card"><span class="stage-label">${room.title}</span><h2>${room.intro}</h2><div class="clue-box">🧩 <strong>Reto ${taskIndex+1}:</strong> responde correctamente para revelar un dígito del código.</div><h3 class="question">${t.q}</h3><div class="options">${sh.displayOptions.map((o,i)=>`<button class="option" onclick="chooseEscape(${i})"><span class="letter">${String.fromCharCode(65+i)}</span><span>${o.text}</span></button>`).join('')}</div><div id="roomFeedback" class="feedback" aria-live="polite"></div><div class="actions"><button class="btn secondary" onclick="renderHome()">Salir del escape room</button><button class="btn primary" id="roomNext" onclick="nextEscapeTask()" disabled>${taskIndex===2&&roomIndex===1?'Abrir la salida':taskIndex===2?'Abrir sala 2':'Siguiente reto →'}</button></div></section>`;}
function chooseEscape(i){if(roomAnswered)return;const t=window.currentRoomTask,ok=i===t.displayCorrect;const f=document.getElementById('roomFeedback');if(ok){roomAnswered=true;roomScore++;roomDigits.push(escapeRooms[roomIndex].tasks[taskIndex].digit);document.querySelectorAll('.option').forEach((b,j)=>{b.disabled=true;if(j===t.displayCorrect)b.classList.add('correct');});f.className='feedback show good';f.innerHTML=`<strong>🔑 Dígito revelado: ${escapeRooms[roomIndex].tasks[taskIndex].digit}</strong><br>${t.why}`;document.getElementById('roomNext').disabled=false;document.querySelector('.topline .pill:last-child').textContent='🔑 Dígitos encontrados: '+roomDigits.length+'/6';}else{const buttons=document.querySelectorAll('.option');buttons[i].classList.add('incorrect');setTimeout(()=>buttons[i]?.classList.remove('incorrect'),650);f.className='feedback show bad';f.innerHTML=`<strong>🔍 Todavía no. ¡Inténtalo de nuevo!</strong><br>${t.why}`;}}
function nextEscapeTask(){if(!roomAnswered)return;if(taskIndex<2){taskIndex++;renderEscapeTask();}else if(roomIndex===0){roomIndex=1;taskIndex=0;renderEscapeDoor();}else renderEscapeResults();}
function renderEscapeDoor(){const code=roomDigits.join('');main.innerHTML=`<section class="card"><span class="stage-label">Primera puerta superada</span><h2>🚪 Has llegado al laboratorio de afirmaciones</h2><p>Terminaste la sala de pareamiento. Ahora abre la segunda sala para poner a prueba tus conocimientos sobre los enunciados de Verdadero/Falso.</p><div class="room-locks"><div class="lock"><strong>${roomDigits.slice(0,3).join(' · ')||'—'}</strong><span>Dígitos de la sala 1</span></div><div class="lock"><strong>3 retos</strong><span>Faltan para la salida</span></div><div class="lock"><strong>⭐ ${roomScore} puntos</strong><span>Respuestas correctas</span></div></div><button class="btn primary" onclick="renderEscapeTask()">Desbloquear sala 2 →</button></section>`;}
function renderEscapeResults(){const success=roomDigits.length===6;main.innerHTML=`<section class="card"><span class="stage-label">Misión de escape completada</span><h2>${success?'🎉 ¡Has abierto el archivo!':'🔓 Has llegado al final del recorrido'}</h2><div class="result-summary"><strong>Registro del participante</strong><p class="small"><strong>Nombre y apellido:</strong> ${escapeHtml(studentInfo.name)} ${escapeHtml(studentInfo.surname)}<br><strong>Sección:</strong> ${escapeHtml(studentInfo.section)}</p></div><div class="result-score">${roomScore}/6</div><p>${success?'¡Excelente! Encontraste los seis dígitos y superaste ambas salas.':'Completaste los seis retos. Revisa las explicaciones y vuelve a jugar para conseguir todos los dígitos del código.'}</p><div class="result-summary"><strong>Código conseguido</strong><p class="small">${roomDigits.length?roomDigits.join(' – '):'No se encontraron dígitos en este intento.'}</p><p class="small">La clave del aprendizaje es aplicar las normas: coherencia entre columnas, instrucciones claras, distractores apropiados y enunciados precisos sin pistas involuntarias.</p></div><p class="small">Este registro aparece en pantalla durante esta sesión. Para entregar el resultado al docente, toma una captura de pantalla; el juego no envía datos automáticamente.</p><div class="actions"><button class="btn secondary" onclick="renderHome()">Volver al registro</button><button class="btn primary" onclick="startEscape()">Volver a jugar ↻</button></div></section>`;}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));}
let escapeAttemptCount = 0;
const originalStartEscape = startEscape;
startEscape = function() {
  escapeAttemptCount += 1;
  originalStartEscape();
};
const screenNoticeObserver = new MutationObserver(() => {
  const card = main.querySelector('.card');
  if (!card) return;
  const heading = card.querySelector('h2')?.textContent || '';
  const stage = card.querySelector('.stage-label');
  if (document.getElementById('screenshot-start-note') || document.getElementById('screenshot-end-note')) return;
  if (document.getElementById('studentForm')) {
    const summary = card.querySelector('.result-summary');
    if (summary) {
      const note = document.createElement('p');
      note.id = 'screenshot-start-note';
      note.className = 'small';
      note.innerHTML = '<strong>📸 Importante:</strong> al terminar la actividad, captura la pantalla del resultado final y adjunta esa imagen en Classroom como evidencia de que realizaste el juego.';
      summary.appendChild(note);
    }
    return;
  }
  if (heading.includes('archivo de evaluación está bloqueado')) {
    if (stage) stage.textContent += ' · Intento ' + escapeAttemptCount;
    const summary = card.querySelector('.result-summary');
    if (summary) {
      const note = document.createElement('p');
      note.id = 'screenshot-start-note';
      note.className = 'small';
      note.innerHTML = '<strong>📸 Recuerda:</strong> al finalizar, toma una captura de pantalla donde se vea tu nombre, apellido, sección, puntuación y código; luego adjúntala en Classroom.';
      summary.appendChild(note);
    }
    return;
  }
  if (heading.includes('Has abierto el archivo') || heading.includes('Has llegado al final del recorrido')) {
    if (stage) stage.textContent += ' · Intento ' + escapeAttemptCount;
    const note = document.createElement('p');
    note.id = 'screenshot-end-note';
    note.className = 'result-summary';
    note.innerHTML = '<strong>📸 Evidencia para Classroom</strong><p class="small">Captura esta pantalla completa, verificando que se vean tu nombre y apellido, sección, número de intento, puntuación y código conseguido. Después, adjunta la captura en la tarea correspondiente de Classroom. El resultado no se envía automáticamente.</p>';
    card.appendChild(note);
  }
});
screenNoticeObserver.observe(main, { childList: true, subtree: true });
renderHome();
</script>
